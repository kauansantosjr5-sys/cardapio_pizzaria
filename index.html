<style>
  :root{
    --creme:#f6f2ea;
    --card:#ffffff;
    --tinta:#1a1512;
    --tinta-2:#584d45;
    --vinho:#8b1a17;
    --vinho-esc:#5e100e;
    --ouro:#e2a92c;
    --ouro-esc:#8a5a0d;
    --linha:#e6ddd0;
    --sombra:0 1px 2px rgba(26,21,18,.05), 0 10px 24px -16px rgba(26,21,18,.35);
    --raio:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    background:var(--creme);color:var(--tinta);
    font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px;line-height:1.5;padding-bottom:112px;-webkit-font-smoothing:antialiased;
  }
  body.travado{overflow:hidden}
  .wrap{max-width:480px;margin:0 auto;padding:0 18px}

  .topo{background:var(--vinho-esc);color:#fff;padding:38px 0 30px;text-align:center;position:relative;overflow:hidden}
  .topo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
    background:linear-gradient(90deg,var(--vinho),var(--ouro),var(--vinho))}
  .logo{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:clamp(34px,10vw,46px);
    line-height:1.02;color:var(--ouro);letter-spacing:-.01em}
  .slogan{margin-top:10px;color:#f3e4d8;font-size:14.5px;line-height:1.45}
  .infos{margin-top:22px;display:flex;flex-direction:column;gap:9px;text-align:left}
  .info{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.09);
    border:1px solid rgba(226,169,44,.34);border-radius:11px;padding:11px 13px;
    font-size:13.5px;color:#fbf1e6;line-height:1.4}
  .info svg{flex:0 0 auto;width:17px;height:17px;color:var(--ouro);margin-top:1px}

  nav{position:sticky;top:0;z-index:20;background:var(--creme);border-bottom:1px solid var(--linha);padding:11px 0}
  .abas{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;max-width:480px;margin:0 auto;padding:2px 18px}
  .abas::-webkit-scrollbar{display:none}
  .aba{flex:0 0 auto;cursor:pointer;border:1px solid var(--linha);background:var(--card);color:var(--tinta);
    font-family:"DM Sans",sans-serif;font-weight:500;font-size:14.5px;padding:9px 17px;border-radius:999px;
    transition:background .16s,color .16s,border-color .16s}
  .aba[aria-current="true"]{background:var(--vinho);border-color:var(--vinho);color:#fff;font-weight:700}
  .aba.destaque{border-color:var(--ouro-esc);color:var(--ouro-esc);font-weight:700}
  .aba.destaque[aria-current="true"]{background:var(--vinho);border-color:var(--vinho);color:#fff}
  .aba:focus-visible{outline:2px solid var(--vinho);outline-offset:2px}

  section{padding-top:34px}
  .cab{margin-bottom:18px}
  .cab h2{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:28px;letter-spacing:-.01em;line-height:1.1}
  .cab p{color:var(--tinta-2);font-size:14px;margin-top:3px}
  .cab .risco{display:block;width:52px;height:3px;background:var(--ouro);border-radius:2px;margin-top:11px}

  .promo-cab{background:var(--vinho);color:#fff;border-radius:var(--raio);padding:18px;margin-bottom:16px;
    box-shadow:var(--sombra)}
  .promo-cab h2{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:27px;color:var(--ouro);line-height:1.1}
  .promo-cab p{margin-top:7px;font-size:14px;color:#fbeee0;line-height:1.45}
  .faixa{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra);
    padding:16px;margin-bottom:14px}
  .faixa-topo{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .faixa-preco{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:30px;color:var(--ouro-esc);
    line-height:1;letter-spacing:-.02em}
  .faixa-preco i{font-style:normal;font-size:14px;font-weight:600;margin-right:3px}
  .faixa-topo small{display:block;color:var(--tinta-2);font-size:12.5px;margin-top:5px}
  .montar{cursor:pointer;border:0;background:var(--vinho);color:#fff;font-family:"DM Sans",sans-serif;
    font-weight:700;font-size:14.5px;padding:12px 17px;border-radius:11px;white-space:nowrap}
  .montar:focus-visible{outline:2px solid var(--vinho-esc);outline-offset:2px}
  .sabores-lista{margin-top:12px;color:var(--tinta-2);font-size:13px;line-height:1.5}
  .escolhidos{margin-top:12px;display:flex;flex-direction:column;gap:7px}
  .escolhido-li{display:flex;align-items:center;gap:10px;background:#fdf6e9;border:1px solid #f0dfbd;
    border-radius:10px;padding:9px 11px;font-size:13.5px;color:var(--tinta)}
  .escolhido-li span{flex:1}
  .tirar{cursor:pointer;border:0;background:none;color:var(--vinho);font-size:13px;font-weight:700;
    text-decoration:underline;padding:3px}
  .tirar:focus-visible{outline:2px solid var(--vinho);outline-offset:2px}

  .prato{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra);
    padding:13px;margin-bottom:14px;display:flex;gap:14px;align-items:stretch;transition:border-color .16s}
  .prato.marcado{border-color:var(--vinho)}
  .foto{flex:0 0 auto;width:98px;height:98px;border-radius:12px;overflow:hidden;background:#f1e7d8;
    display:grid;place-items:center}
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .foto svg{width:100%;height:100%}
  .prato-txt{flex:1;min-width:0;display:flex;flex-direction:column}
  .prato-nome{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:19px;line-height:1.18;letter-spacing:-.01em}
  .ingr{margin-top:5px;color:var(--tinta-2);font-size:13px;line-height:1.42}
  .prato-pe{margin-top:auto;padding-top:11px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .preco{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:22px;color:var(--ouro-esc);
    white-space:nowrap;letter-spacing:-.01em}
  .preco i{font-style:normal;font-size:13px;font-weight:600;margin-right:2px}

  .qtd{display:flex;align-items:center;gap:3px;flex:0 0 auto}
  .qtd button{width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
    border:1.5px solid var(--vinho);background:var(--card);color:var(--vinho);font-family:"DM Sans",sans-serif;
    font-size:21px;font-weight:500;line-height:1;transition:transform .1s,background .16s}
  .qtd button:active{transform:scale(.9)}
  .qtd button:focus-visible{outline:2px solid var(--vinho);outline-offset:2px}
  .qtd .mais{background:var(--vinho);color:#fff}
  .qtd .n{min-width:24px;text-align:center;font-weight:700;font-size:17px;color:var(--tinta)}
  .qtd[data-vazio="true"] .menos,.qtd[data-vazio="true"] .n{display:none}

  .extra{margin-top:30px;background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);
    box-shadow:var(--sombra);padding:18px}
  .extra h3{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:19px}
  .extra p{color:var(--tinta-2);font-size:13.5px;margin-top:3px}
  .op{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .op button{flex:1 1 120px;cursor:pointer;padding:11px 14px;border-radius:11px;border:1.5px solid var(--linha);
    background:var(--creme);color:var(--tinta);font-family:"DM Sans",sans-serif;font-size:14.5px;font-weight:500;
    transition:background .16s,border-color .16s,color .16s}
  .op button[aria-pressed="true"]{background:var(--vinho);border-color:var(--vinho);color:#fff;font-weight:700}
  .op button:focus-visible{outline:2px solid var(--vinho);outline-offset:2px}

  footer{padding:34px 0 22px;text-align:center;color:var(--tinta-2);font-size:13px;line-height:1.7}
  footer b{color:var(--tinta);font-family:"Fraunces",Georgia,serif;font-size:15px}

  .barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--vinho-esc);border-top:3px solid var(--ouro);
    padding:13px 18px calc(13px + env(safe-area-inset-bottom));transform:translateY(135%);transition:transform .24s ease}
  .barra[data-ativa="true"]{transform:translateY(0)}
  .barra-in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:13px}
  .barra-resumo{flex:1;min-width:0}
  .barra-resumo b{display:block;font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:24px;
    color:var(--ouro);line-height:1.15}
  .barra-resumo small{color:#f0ddcd;font-size:12.5px;display:block}
  .limpar{background:none;border:0;color:#f0ddcd;font-size:12.5px;cursor:pointer;text-decoration:underline;
    padding:3px 0;margin-top:1px}
  .limpar:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
  .enviar{flex:0 0 auto;border:0;cursor:pointer;background:var(--ouro);color:#2a1a02;font-family:"DM Sans",sans-serif;
    font-weight:700;font-size:15px;padding:14px 19px;border-radius:12px;line-height:1.2}
  .enviar:focus-visible{outline:2px solid #fff;outline-offset:2px}

  .sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet[hidden]{display:none}
  .sheet-fundo{position:absolute;inset:0;background:rgba(26,21,18,.55)}
  .sheet-cx{position:relative;width:100%;max-width:480px;background:var(--card);
    border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:86vh;display:flex;flex-direction:column}
  .sheet-cx h3{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:23px;line-height:1.15}
  .sheet-cx>p{color:var(--tinta-2);font-size:13.5px;margin-top:4px}
  .sabores{margin:16px 0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .sabores button{cursor:pointer;text-align:left;padding:13px 14px;border-radius:11px;border:1.5px solid var(--linha);
    background:var(--creme);color:var(--tinta);font-family:"DM Sans",sans-serif;font-size:15px;font-weight:500;
    display:flex;justify-content:space-between;align-items:center;gap:10px}
  .sabores button[aria-pressed="true"]{background:var(--vinho);border-color:var(--vinho);color:#fff;font-weight:700}
  .sabores button:focus-visible{outline:2px solid var(--vinho);outline-offset:2px}
  .sheet-pe{display:flex;gap:10px}
  .sheet-pe button{flex:1;cursor:pointer;padding:14px;border-radius:12px;font-family:"DM Sans",sans-serif;
    font-size:15px;font-weight:700}
  #sheet-cancel{border:1.5px solid var(--linha);background:var(--card);color:var(--tinta)}
  #sheet-ok{border:0;background:var(--vinho);color:#fff}
  #sheet-ok[disabled]{background:#d8cec2;color:#6f655c;cursor:not-allowed}
  .sheet-pe button:focus-visible{outline:2px solid var(--vinho-esc);outline-offset:2px}

  @media (max-width:360px){
    .foto{width:86px;height:86px}
    .prato-nome{font-size:17.5px}
    .preco{font-size:20px}
    .faixa-preco{font-size:26px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>
</head>
<body>

<header class="topo">
  <div class="wrap">
    <h1 class="logo" id="logo"></h1>
    <p class="slogan" id="slogan"></p>
    <div class="infos">
      <div class="info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
        <span id="horario"></span>
      </div>
      <div class="info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6M6 17l3-8h5l3 5"/><path d="M10 9V6h3"/></svg>
        <span id="entrega"></span>
      </div>
    </div>
  </div>
</header>

<nav><div class="abas" id="abas"></div></nav>

<main class="wrap" id="lista"></main>

<div class="wrap">
  <div class="extra">
    <h3 id="borda-titulo"></h3>
    <p id="borda-sub"></p>
    <div class="op" id="borda-op"></div>
  </div>
  <footer>
    <b id="rodape-nome"></b><br>
    Monte seu pedido e envie pelo WhatsApp. A gente confirma na hora.
  </footer>
</div>

<div class="barra" id="barra">
  <div class="barra-in">
    <div class="barra-resumo">
      <b id="total">R$ 0,00</b>
      <small id="resumo">Nenhum item</small>
      <button class="limpar" id="limpar">Limpar pedido</button>
    </div>
    <button class="enviar" id="enviar">Enviar pedido</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-fundo" id="sheet-fundo"></div>
  <div class="sheet-cx" role="dialog" aria-modal="true" aria-labelledby="sheet-tit">
    <h3 id="sheet-tit"></h3>
    <p id="sheet-sub"></p>
    <div class="sabores" id="sabores"></div>
    <div class="sheet-pe">
      <button id="sheet-cancel">Cancelar</button>
      <button id="sheet-ok" disabled>Adicionar</button>
    </div>
  </div>
</div>

<script>
(function(){
  const carrinho = {};
  const combos = [];
  const meios = [];
  let borda = null;

  const brl  = v => CONFIG.moeda + " " + v.toFixed(2).replace(".", ",");
  const val  = v => v.toFixed(2).replace(".", ",");
  const el   = id => document.getElementById(id);
  const slug = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                     .toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  function marcaBebida(){
    const base = "#f2e3cd", traco = "#8a5a0d";
    return '<svg viewBox="0 0 80 80" role="img" aria-hidden="true">' +
           '<rect width="80" height="80" fill="' + base + '"/>' +
           '<path d="M33 12h14v11l7 9v32a4 4 0 0 1-4 4H30a4 4 0 0 1-4-4V32l7-9z" ' +
             'fill="none" stroke="' + traco + '" stroke-width="2.2" stroke-linejoin="round"/>' +
           '<path d="M33 12h14" stroke="' + traco + '" stroke-width="2.4" stroke-linecap="round"/>' +
           '<path d="M27 46h26" stroke="' + traco + '" stroke-width="1.6" stroke-dasharray="3 4" opacity=".65"/>' +
           '</svg>';
  }

  function marca(catId){
    if (catId === "bebidas") return marcaBebida();
    const doce = catId === "doces";
    const base = doce ? "#f7ece0" : "#f2e3cd";
    const traco = doce ? "#8b1a17" : "#8a5a0d";
    const recheio = doce
      ? '<path d="M26 40q7-8 14 0t14 0" stroke="' + traco + '" stroke-width="2.4" fill="none" stroke-linecap="round"/>' +
        '<path d="M26 52q7-8 14 0t14 0" stroke="' + traco + '" stroke-width="2.4" fill="none" stroke-linecap="round"/>'
      : '<circle cx="33" cy="36" r="3.6" fill="#8b1a17"/><circle cx="48" cy="33" r="3" fill="#8b1a17"/>' +
        '<circle cx="41" cy="47" r="3.9" fill="#8b1a17"/><circle cx="29" cy="50" r="2.8" fill="#e2a92c"/>' +
        '<circle cx="51" cy="48" r="3.2" fill="#e2a92c"/>';
    return '<svg viewBox="0 0 80 80" role="img" aria-hidden="true">' +
           '<rect width="80" height="80" fill="' + base + '"/>' +
           '<circle cx="40" cy="40" r="26" fill="none" stroke="' + traco + '" stroke-width="2.2"/>' +
           '<circle cx="40" cy="40" r="21" fill="none" stroke="' + traco + '" stroke-width="1.4" stroke-dasharray="3 5" opacity=".65"/>' +
           recheio + '</svg>';
  }

  // 1a tentativa: pasta fotos/  ·  2a tentativa: mesmo nível do index  ·  depois, o desenho
  document.addEventListener("error", function(e){
    const img = e.target;
    if (!img || img.tagName !== "IMG") return;
    const box = img.closest(".foto");
    if (!box) return;
    if (img.dataset.plano === "b") {
      box.innerHTML = marca(box.dataset.cat);
    } else {
      img.dataset.plano = "b";
      img.src = img.dataset.solto;
    }
  }, true);

  document.title = "Cardápio — " + CONFIG.nome;
  el("logo").textContent = CONFIG.nome;
  el("slogan").textContent = CONFIG.slogan;
  el("horario").textContent = CONFIG.horario;
  el("entrega").textContent = CONFIG.entrega;
  el("rodape-nome").textContent = CONFIG.nome;
  el("borda-titulo").textContent = CONFIG.borda.nome;
  el("borda-sub").textContent = "Escolha o recheio da borda. Soma " + brl(CONFIG.borda.preco) + " por pizza do pedido.";

  const promoOn = CONFIG.combo && CONFIG.combo.ativo;
  const abas = el("abas");
  const lista = el("lista");
  const secoes = [];

  function criaAba(rotulo, alvo, destaque){
    const b = document.createElement("button");
    b.className = "aba" + (destaque ? " destaque" : "");
    b.textContent = rotulo;
    b.setAttribute("aria-current", "false");
    b.onclick = function(){ document.getElementById(alvo).scrollIntoView({block:"start"}); };
    abas.appendChild(b);
  }

  if (promoOn){
    criaAba(CONFIG.combo.titulo, "sec-promo", true);
    const sec = document.createElement("section");
    sec.id = "sec-promo";
    sec.innerHTML = '<div class="promo-cab"><h2>' + CONFIG.combo.titulo + '</h2><p>' +
                    CONFIG.combo.chamada + '</p></div>';
    CONFIG.combo.faixas.forEach(function(f, i){
      const card = document.createElement("div");
      card.className = "faixa";
      card.innerHTML =
        '<div class="faixa-topo">' +
          '<div>' +
            '<div class="faixa-preco"><i>' + CONFIG.moeda + '</i>' + val(f.preco) + '</div>' +
            '<small>2 pizzas grandes</small>' +
          '</div>' +
          '<button class="montar">Escolher sabores</button>' +
        '</div>' +
        '<p class="sabores-lista">' + f.sabores.join(" · ") + '</p>' +
        '<div class="escolhidos" data-faixa="' + i + '"></div>';
      card.querySelector(".montar").onclick = function(){ abreSheet(i); };
      sec.appendChild(card);
    });
    lista.appendChild(sec);
    secoes.push(sec);
  }

  const meioOn = CONFIG.meioAMeio && CONFIG.meioAMeio.ativo;
  if (meioOn){
    criaAba(CONFIG.meioAMeio.titulo, "sec-meio", true);
    const sec = document.createElement("section");
    sec.id = "sec-meio";
    sec.innerHTML = '<div class="promo-cab"><h2>' + CONFIG.meioAMeio.titulo + '</h2><p>' +
                    CONFIG.meioAMeio.chamada + '</p></div>' +
                    '<div class="faixa">' +
                      '<div class="faixa-topo">' +
                        '<div><small>Pizza grande dividida em 2 sabores, do jeito que você quiser</small></div>' +
                        '<button class="montar">Escolher sabores</button>' +
                      '</div>' +
                      '<div class="escolhidos" id="escolhidos-meio"></div>' +
                    '</div>';
    sec.querySelector(".montar").onclick = function(){ abreSheetMeio(); };
    lista.appendChild(sec);
    secoes.push(sec);
  }

  CONFIG.categorias.forEach(function(cat){
    criaAba(cat.nome, "sec-" + cat.id, false);
    const sec = document.createElement("section");
    sec.id = "sec-" + cat.id;
    sec.innerHTML = '<div class="cab"><h2>' + cat.nome + '</h2><p>' + cat.resumo +
                    '</p><span class="risco"></span></div>';

    cat.itens.forEach(function(it, idx){
      const chave = cat.id + ":" + idx;
      const arquivo = slug(it.n) + CONFIG.extFotos;
      const caminho = it.img || (CONFIG.pastaFotos + arquivo);

      const card = document.createElement("article");
      card.className = "prato";
      card.innerHTML =
        '<div class="foto" data-cat="' + cat.id + '">' +
          '<img src="' + caminho + '" data-solto="' + arquivo + '" alt="Pizza ' + it.n + '" loading="lazy">' +
        '</div>' +
        '<div class="prato-txt">' +
          '<h3 class="prato-nome">' + it.n + '</h3>' +
          '<p class="ingr">' + it.d + '</p>' +
          '<div class="prato-pe">' +
            '<span class="preco"><i>' + CONFIG.moeda + '</i>' + val(it.p) + '</span>' +
            '<div class="qtd" data-vazio="true">' +
              '<button class="menos" aria-label="Tirar uma ' + it.n + '">−</button>' +
              '<span class="n">0</span>' +
              '<button class="mais" aria-label="Adicionar ' + it.n + '">+</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      const box = card.querySelector(".qtd");
      const num = card.querySelector(".n");
      function pinta(){
        const q = carrinho[chave] || 0;
        num.textContent = q;
        box.dataset.vazio = q === 0 ? "true" : "false";
        card.classList.toggle("marcado", q > 0);
        atualiza();
      }
      card.querySelector(".mais").onclick = function(){ carrinho[chave] = (carrinho[chave] || 0) + 1; pinta(); };
      card.querySelector(".menos").onclick = function(){
        carrinho[chave] = Math.max(0, (carrinho[chave] || 0) - 1);
        if (!carrinho[chave]) delete carrinho[chave];
        pinta();
      };
      sec.appendChild(card);
    });
    lista.appendChild(sec);
    secoes.push(sec);
  });

  function saboresParaMeio(){
    const out = [];
    CONFIG.categorias.forEach(function(cat){
      if (cat.id === "doces" || cat.bebida) return;
      cat.itens.forEach(function(it){ out.push(it.n); });
    });
    return out;
  }

  function precoDoSabor(nome){
    let achado = 0;
    CONFIG.categorias.forEach(function(cat){
      cat.itens.forEach(function(it){ if (it.n === nome) achado = it.p; });
    });
    return achado;
  }

  const sheet = el("sheet"), caixaSabores = el("sabores"), btnOk = el("sheet-ok");
  let faixaAberta = null, escolha = [], sheetModo = null, nomesAtual = [];

  function montaBotoesSheet(){
    const scrollAntes = caixaSabores.scrollTop;
    caixaSabores.innerHTML = "";
    nomesAtual.forEach(function(nome){
      const b = document.createElement("button");
      b.type = "button";
      const rotuloPreco = sheetModo === "meio" ? " — " + brl(precoDoSabor(nome)) : "";
      b.innerHTML = '<span>' + nome + rotuloPreco + '</span><span class="conta"></span>';
      b.setAttribute("aria-pressed", "false");
      b.onclick = function(){
        const vezes = escolha.filter(function(x){ return x === nome; }).length;
        if (escolha.length < 2) escolha.push(nome);
        else if (vezes > 0) escolha = escolha.filter(function(x){ return x !== nome; });
        else return;
        redesenha();
      };
      caixaSabores.appendChild(b);
    });
    redesenha();
    caixaSabores.scrollTop = scrollAntes;
  }

  function abreSheet(i){
    sheetModo = "combo";
    faixaAberta = i; escolha = [];
    const f = CONFIG.combo.faixas[i];
    nomesAtual = f.sabores;
    el("sheet-tit").textContent = CONFIG.combo.titulo + " — " + brl(f.preco);
    el("sheet-sub").textContent = "Escolha 2 sabores. Quer a mesma pizza duas vezes? Toque duas vezes no sabor.";
    el("sheet-cancel").textContent = "Cancelar";
    montaBotoesSheet();
    sheet.hidden = false;
    document.body.classList.add("travado");
  }

  function abreSheetMeio(){
    sheetModo = "meio";
    faixaAberta = null; escolha = [];
    nomesAtual = saboresParaMeio();
    el("sheet-tit").textContent = CONFIG.meioAMeio.titulo;
    el("sheet-sub").textContent = "Escolha 2 sabores diferentes. Vale o valor do sabor mais caro.";
    el("sheet-cancel").textContent = "Cancelar";
    montaBotoesSheet();
    sheet.hidden = false;
    document.body.classList.add("travado");
  }

  function redesenha(){
    Array.prototype.forEach.call(caixaSabores.children, function(b, i){
      const nome = nomesAtual[i];
      const vezes = escolha.filter(function(x){ return x === nome; }).length;
      b.setAttribute("aria-pressed", vezes > 0 ? "true" : "false");
      b.querySelector(".conta").textContent = vezes === 2 ? "2x" : (vezes === 1 ? "1x" : "");
    });
    btnOk.disabled = escolha.length !== 2;
    btnOk.textContent = escolha.length === 2 ? "Adicionar ao pedido" : "Escolha " + (2 - escolha.length) + " sabor(es)";
  }

  function fechaSheet(){
    sheet.hidden = true;
    document.body.classList.remove("travado");
    faixaAberta = null;
    sheetModo = null;
  }
  el("sheet-cancel").onclick = fechaSheet;
  el("sheet-fundo").onclick = fechaSheet;
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !sheet.hidden) fechaSheet(); });

  btnOk.onclick = function(){
    if (escolha.length !== 2) return;
    if (sheetModo === "combo"){
      const f = CONFIG.combo.faixas[faixaAberta];
      combos.push({ faixa: faixaAberta, preco: f.preco, sabores: escolha.slice() });
      pintaCombos();
      fechaSheet();
    } else if (sheetModo === "meio"){
      const p1 = precoDoSabor(escolha[0]), p2 = precoDoSabor(escolha[1]);
      meios.push({ sabores: escolha.slice(), preco: Math.max(p1, p2) });
      pintaMeios();
      // continua na mesma tela: dá pra montar outra pizza meio a meio direto, sem reabrir nada
      escolha = [];
      montaBotoesSheet();
      el("sheet-sub").textContent = meios.length + (meios.length === 1 ? " pizza meio a meio adicionada. " : " pizzas meio a meio adicionadas. ") +
                                     "Escolha mais 2 sabores pra outra pizza, ou toque em Concluir.";
      el("sheet-cancel").textContent = "Concluir";
    }
    atualiza();
  };

  function textoCombo(c){
    return c.sabores[0] === c.sabores[1] ? "2x " + c.sabores[0] : c.sabores[0] + " + " + c.sabores[1];
  }

  function pintaCombos(){
    Array.prototype.forEach.call(document.querySelectorAll(".escolhidos"), function(box){
      const i = Number(box.dataset.faixa);
      box.innerHTML = "";
      combos.forEach(function(c, idx){
        if (c.faixa !== i) return;
        const li = document.createElement("div");
        li.className = "escolhido-li";
        li.innerHTML = '<span>' + textoCombo(c) + '</span>';
        const x = document.createElement("button");
        x.className = "tirar"; x.textContent = "tirar";
        x.onclick = function(){ combos.splice(idx, 1); pintaCombos(); atualiza(); };
        li.appendChild(x);
        box.appendChild(li);
      });
    });
  }

  function textoMeio(m){
    return m.sabores[0] === m.sabores[1] ? "2x " + m.sabores[0] : m.sabores[0] + " / " + m.sabores[1];
  }

  function pintaMeios(){
    const box = el("escolhidos-meio");
    if (!box) return;
    box.innerHTML = "";
    meios.forEach(function(m, idx){
      const li = document.createElement("div");
      li.className = "escolhido-li";
      li.innerHTML = '<span>' + textoMeio(m) + ' — ' + brl(m.preco) + '</span>';
      const x = document.createElement("button");
      x.className = "tirar"; x.textContent = "tirar";
      x.onclick = function(){ meios.splice(idx, 1); pintaMeios(); atualiza(); };
      li.appendChild(x);
      box.appendChild(li);
    });
  }

  const opBox = el("borda-op");
  CONFIG.borda.opcoes.forEach(function(op){
    const b = document.createElement("button");
    b.textContent = op; b.setAttribute("aria-pressed", "false");
    b.onclick = function(){
      borda = (borda === op) ? null : op;
      Array.prototype.forEach.call(opBox.children, function(x){
        x.setAttribute("aria-pressed", x.textContent === borda ? "true" : "false");
      });
      atualiza();
    };
    opBox.appendChild(b);
  });

  function avulsas(){
    const out = [];
    CONFIG.categorias.forEach(function(cat){
      cat.itens.forEach(function(it, idx){
        const q = carrinho[cat.id + ":" + idx];
        if (q) out.push({ nome: it.n, preco: it.p, q: q, bebida: !!cat.bebida });
      });
    });
    return out;
  }

  function conta(){
    const ped = avulsas();
    const pedPizzas = ped.filter(function(i){ return !i.bebida; });
    const bebidas = ped.filter(function(i){ return i.bebida; }).reduce(function(s, i){ return s + i.q; }, 0);
    const pizzas = pedPizzas.reduce(function(s, i){ return s + i.q; }, 0) + combos.length * 2 + meios.length;
    const base = ped.reduce(function(s, i){ return s + i.preco * i.q; }, 0) +
                 combos.reduce(function(s, c){ return s + c.preco; }, 0) +
                 meios.reduce(function(s, m){ return s + m.preco; }, 0);
    const extraBorda = borda ? CONFIG.borda.preco * pizzas : 0;
    return { ped: ped, pizzas: pizzas, bebidas: bebidas, total: base + extraBorda, extraBorda: extraBorda };
  }

  function atualiza(){
    const c = conta();
    const itens = c.pizzas + c.bebidas;
    el("total").textContent = brl(c.total);
    if (itens === 0) {
      el("resumo").textContent = "Nenhum item";
    } else {
      const partes = [];
      if (c.pizzas) partes.push(c.pizzas + (c.pizzas === 1 ? " pizza" : " pizzas"));
      if (combos.length) partes.push(combos.length + (combos.length === 1 ? " combo" : " combos"));
      if (meios.length) partes.push(meios.length + (meios.length === 1 ? " meio a meio" : " meios a meio"));
      if (c.bebidas) partes.push(c.bebidas + (c.bebidas === 1 ? " bebida" : " bebidas"));
      if (borda) partes.push("borda " + borda.toLowerCase());
      el("resumo").textContent = partes.join(" · ");
    }
    el("barra").dataset.ativa = itens > 0 ? "true" : "false";
  }

  el("limpar").onclick = function(){
    Object.keys(carrinho).forEach(function(k){ delete carrinho[k]; });
    combos.length = 0;
    meios.length = 0;
    borda = null;
    Array.prototype.forEach.call(opBox.children, function(x){ x.setAttribute("aria-pressed", "false"); });
    Array.prototype.forEach.call(document.querySelectorAll(".prato"), function(card){
      card.classList.remove("marcado");
      card.querySelector(".n").textContent = "0";
      card.querySelector(".qtd").dataset.vazio = "true";
    });
    pintaCombos();
    pintaMeios();
    atualiza();
  };

  el("enviar").onclick = function(){
    const c = conta();
    if (c.pizzas + c.bebidas === 0) return;

    let msg = "Olá! Quero fazer um pedido pelo cardápio:\n\n";
    combos.forEach(function(x){
      msg += CONFIG.combo.titulo + " " + brl(x.preco) + " — " + textoCombo(x) + "\n";
    });
    meios.forEach(function(m){
      msg += "Meio a meio — " + textoMeio(m) + " — " + brl(m.preco) + "\n";
    });
    if ((combos.length || meios.length) && c.ped.length) msg += "\n";
    c.ped.forEach(function(i){ msg += i.q + "x " + i.nome + " — " + brl(i.preco * i.q) + "\n"; });
    if (borda) {
      msg += "\nBorda " + borda.toLowerCase() + " em " + c.pizzas +
             (c.pizzas === 1 ? " pizza" : " pizzas") + " — " + brl(c.extraBorda) + "\n";
    }
    msg += "\nTotal: " + brl(c.total) + " (sem a taxa de entrega)";
    msg += "\n\nNome:\nEndereço:\nPagamento:";

    window.open("https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(msg), "_blank");
  };

  const obs = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if (!e.isIntersecting) return;
      const i = secoes.indexOf(e.target);
      Array.prototype.forEach.call(abas.children, function(b, j){
        b.setAttribute("aria-current", i === j ? "true" : "false");
      });
    });
  }, { rootMargin: "-18% 0px -70% 0px" });
  secoes.forEach(function(s){ obs.observe(s); });

  if (abas.firstChild) abas.firstChild.setAttribute("aria-current", "true");
  atualiza();
})();
</script>
</body>
</html>
